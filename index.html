<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Birthday Page</title>

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ffe6f4, #ffeaff, #ffddf4);
        text-align: center;
        padding: 30px;
    }

    h1 {
        color: hotpink;
        font-size: 40px;
        margin-bottom: 10px;
    }

    /* Foto + Bingkai */
    .birthday-frame {
        position: relative;
        width: 280px;
        height: 280px;
        margin: 30px auto;
        border: 6px solid #ff80c8;
        border-radius: 20px;
        padding: 10px;
        background: linear-gradient(135deg, #ffe6f4, #ffd2eb);
        box-shadow: 0 8px 25px rgba(255, 120, 170, 0.4),
                    inset 0 0 20px rgba(255, 150, 200, 0.5);
    }

    .birthday-frame::before {
        content: "🎀 Happy Birthday 🎀";
        position: absolute;
        top: -32px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffb3dd;
        padding: 4px 14px;
        border-radius: 12px;
        font-weight: bold;
        color: #b30069;
        font-size: 15px;
        box-shadow: 0 2px 6px rgba(255, 100, 170, 0.4);
    }

    .birthday-frame::after {
        content: "🎂 🎉 💕";
        position: absolute;
        bottom: -32px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffb3dd;
        padding: 4px 14px;
        border-radius: 12px;
        font-weight: bold;
        color: #b30069;
        font-size: 16px;
        box-shadow: 0 2px 6px rgba(255, 100, 170, 0.4);
    }

    .birthday-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 14px;
        display: block;
    }

    /* Teks berjalan */
    .marquee {
        margin-top: 20px;
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        font-size: 22px;
        color: #b30069;
        font-weight: bold;
        animation: slide 12s linear infinite;
    }

    @keyframes slide {
        from { transform: translateX(100%); }
        to   { transform: translateX(-100%); }
    }

    /* Tombol Pesan */
    .msg-btn {
        margin-top: 30px;
        font-size: 50px;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .msg-btn:hover {
        transform: scale(1.2);
    }

    #pesanArea {
        margin-top: 20px;
        font-size: 22px;
        color: #b30069;
        font-weight: bold;
        min-height: 40px;
    }
</style>

</head>
<body>

<h1>Happy Birthday 💖</h1>

<!-- Foto -->
<div class="birthday-frame">
    <img src="foto.jpg" class="birthday-photo">
</div>

<!-- Teks berjalan -->
<div class="marquee">semoga keinginan dan harapannya terkabul</div>

<!-- Simbol pesan -->
<div class="msg-btn" onclick="tampilPesan()">💌</div>

<div id="pesanArea"></div>

<script>
let tahap = 0;

function tampilPesan() {
    const pesanBox = document.getElementById("pesanArea");

    if (tahap === 0) {
        pesanBox.innerHTML = "⏳ Waktu berubah";
        tahap = 1;
    } else if (tahap === 1) {
        pesanBox.innerHTML = "🎂 Umur bertambah";
        tahap = 2;
    } else if (tahap === 2) {
        pesanBox.innerHTML = "💘 Perasaan tertinggal";
        tahap = 3;
    } else {
        pesanBox.innerHTML = "";
        tahap = 0;
    }
}
</script>

</body>
</html>
