<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Birthday — Kawaii Full Effects</title>
<style>
:root{
  --bg1:#fff0f6;
  --bg2:#fff6fb;
  --pink:#ff4fa8;
  --accent:#ff89c9;
  --muted:#5a3850;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background: radial-gradient(circle at 10% 10%, #fff8fb 0%, #fff0f6 25%, #ffe6f9 100%);
  color:var(--muted);
  text-align:center;
  overflow-x:hidden;
  min-height:100vh;
  padding:28px 12px 60px;
}
header{margin-bottom:8px}
h1{
  margin:10px 0 6px;
  color:var(--pink);
  font-size:38px;
  text-shadow:0 6px 18px rgba(255,74,154,0.12);
}
.sub{font-size:14px; color:#b14a84; margin-bottom:6px}

/* FRAME DENGAN BALON DAN GLOW */
.birthday-frame{
  position:relative;
  width:min(88vw,320px);
  height:min(88vw,320px);
  margin:18px auto;
  border-radius:22px;
  padding:10px;
  background:linear-gradient(180deg,#fff7fb,#ffe8f6);
  border:5px solid #ff4fa8;
  box-shadow:0 12px 35px rgba(255,120,170,0.15);
  overflow:hidden;
  animation: glow 2s infinite alternate;
}
@keyframes glow {
  0% { box-shadow:0 0 15px rgba(255,80,140,0.2),0 0 25px rgba(255,120,170,0.2);}
  100% { box-shadow:0 0 30px rgba(255,80,140,0.4),0 0 50px rgba(255,120,170,0.3);}
}
.photo{
  width:100%; height:100%;
  object-fit:cover;
  border-radius:14px;
}

/* Countdown kecil H1 */
#smallCountdown{
  font-size:16px;
  color:#b12f76;
  margin:6px 0;
  font-weight:700;
}

/* MARQUEE */
.marquee-wrapper{
  overflow:hidden;
  width:100%;
  margin-top:14px;
}
.marquee{
  display:inline-block;
  padding-left:100%;
  white-space:nowrap;
  font-size:min(5vw,18px);
  color:#b12f76;
  font-weight:700;
  animation: runtext 14s linear infinite;
}
@keyframes runtext{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* CONTROLS */
.controls{
  margin-top:18px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
.icon-btn{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(180deg,#ff8fc7,#ff4fa8);
  color:white;font-size:28px;border:none;cursor:pointer;
  box-shadow:0 10px 30px rgba(255,80,140,0.18);
  display:flex;align-items:center;justify-content:center;
}
.small-btn{
  background:#fff; color:var(--pink); padding:10px 12px;
  border-radius:12px; border:1px solid #ffd6ea; font-weight:700;
  cursor:pointer;
}

#pesanArea{margin-top:18px; font-size:min(6vw,22px); color:var(--pink); font-weight:800;}

.effects-layer{
  position:fixed; inset:0;
  pointer-events:none; z-index:50;
}

.heart,.petal,.sparkle,.balloon,.star,.moon,.cloud,.doll{
  position:absolute;
}

@media(max-width:420px){
  .birthday-frame{width:88vw;height:88vw}
}
</style>
</head>

<body>

<header>
  <h1 id="bigAge">Menghitung…</h1>
  <div id="smallCountdown">0d 0h 0m 0s menuju ulang tahun</div>
  <div class="sub">Happy Birthday 🎈 Neng ♥️✨</div>
</header>

<div class="birthday-frame">
  <img src="foto.jpg" class="photo" alt="Foto ulang tahun">
</div>

<div class="marquee-wrapper">
  <div class="marquee" id="marquee">Hari spesial untuk orang spesial juga✨</div>
</div>

<div class="controls">
  <button class="icon-btn" id="msgBtn">💌</button>
  <button class="small-btn" id="musicToggle">⏯ Musik</button>
  <button class="icon-btn" id="dollBtn">🎁</button>
</div>

<div id="pesanArea"></div>
<div class="effects-layer" id="effects"></div>

<audio id="bgMusic" loop>
  <source src="musik.mp3" type="audio/mpeg">
</audio>

<script>
// ===================== AGE & COUNTDOWN =====================
(function(){
  const birth = new Date("2002-11-15T00:00:00+07:00");
  const h1Age = document.getElementById("bigAge");
  const smallCountdown = document.getElementById("smallCountdown");

  function updateAge(){
    const now = new Date();
    let age = now.getFullYear() - birth.getFullYear();
    const hasHadBirthday = now.getMonth() > birth.getMonth() || 
      (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
    if(!hasHadBirthday) age -= 1;

    h1Age.textContent = age + " Tahun 🎂";

    let next = new Date(now.getFullYear(), birth.getMonth(), birth.getDate());
    if(hasHadBirthday) next.setFullYear(now.getFullYear()+1);
    const diff = next - now;
    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    const m = Math.floor((diff % (1000*60*60)) / (1000*60));
    const s = Math.floor((diff % (1000*60)) / 1000);

    smallCountdown.textContent = `${d}d ${h}h ${m}m ${s}s menuju ulang tahun ke-${age+1}`;
  }

  updateAge();
  setInterval(updateAge,1000);
})();

// ===================== POPUP UCAPAN =====================
const msgs = [
  "Semoga harimu menyenangkan! 🎉",
  "Semoga semua impianmu terkabul! 🌸",
  "Selamat ulang tahun! 🎂",
  "Semoga selalu bahagia dan sehat! 💖"
];
let mi = 0;

document.getElementById("msgBtn").onclick = ()=>{
  const birth = new Date("2002-11-15T00:00:00+07:00");
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const hasHadBirthday = now.getMonth() > birth.getMonth() || 
      (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
  if(!hasHadBirthday) age -= 1;

  const backdrop = document.createElement("div");
  backdrop.style.position="fixed";
  backdrop.style.inset="0";
  backdrop.style.background="rgba(0,0,0,0.25)";
  backdrop.style.zIndex=199;
  backdrop.style.opacity="0";
  backdrop.style.transition="opacity 0.3s";
  document.body.appendChild(backdrop);
  setTimeout(()=>backdrop.style.opacity="1",50);

  const popup = document.createElement("div");
  popup.style.position="fixed";
  popup.style.top="50%";
  popup.style.left="50%";
  popup.style.transform="translate(-50%, -50%) scale(0)";
  popup.style.background="linear-gradient(135deg,#ffecf8,#fff0f6)";
  popup.style.border="5px solid #ff4fa8";
  popup.style.borderRadius="20px";
  popup.style.padding="25px 30px";
  popup.style.boxShadow="0 10px 40px rgba(255,80,140,0.4)";
  popup.style.zIndex=200;
  popup.style.textAlign="center";
  popup.style.transition="transform 0.4s cubic-bezier(0.68,-0.55,0.265,1.55)";
  popup.style.maxWidth="90vw";
  setTimeout(()=>popup.style.transform="translate(-50%, -50%) scale(1)",50);

  let pesanTeks = msgs[mi];
  if(pesanTeks.includes("Selamat ulang tahun")) 
      pesanTeks = `Selamat ulang tahun ke-${age}! 🎂🎈`;

  popup.innerHTML = `
    <button id="closeBtn" style="
      position:absolute;
      top:12px;
      right:12px;
      background:none;
      border:none;
      font-size:24px;
      font-weight:bold;
      cursor:pointer;
      color:#b12f76;
      transition: color 0.2s;
    ">×</button>
    <p style="
      font-size:22px;
      color:#b12f76;
      margin:0 0 16px 0;
      font-weight:700;
      word-wrap:break-word;
    ">${pesanTeks}</p>
    <button id="nextBtn" style="
      padding:10px 16px;
      border-radius:12px;
      border:none;
      background:#ff4fa8;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition: background 0.2s;
    ">Next</button>
  `;
  document.body.appendChild(popup);

  const closePopup = ()=>{
    popup.style.transform="translate(-50%, -50%) scale(0)";
    backdrop.style.opacity="0";
    setTimeout(()=>{
      popup.remove();
      backdrop.remove();
    },400);
  };

  document.getElementById("closeBtn").onclick = closePopup;
  document.getElementById("closeBtn").onmouseover = ()=>document.getElementById("closeBtn").style.color = "#ff4fa8";
  document.getElementById("closeBtn").onmouseout = ()=>document.getElementById("closeBtn").style.color = "#b12f76";
  document.getElementById("nextBtn").onclick = ()=>{
    mi=(mi+1)%msgs.length;
    closePopup();
    setTimeout(()=>document.getElementById("msgBtn").click(),400);
  };
  document.getElementById("nextBtn").onmouseover = ()=>document.getElementById("nextBtn").style.background = "#ff89c9";
  document.getElementById("nextBtn").onmouseout = ()=>document.getElementById("nextBtn").style.background = "#ff4fa8";

  backdrop.onclick = closePopup;
};

// ===================== MUSIC =====================
const bg=document.getElementById("bgMusic");
document.getElementById("musicToggle").onclick = ()=>{
  if(bg.paused) bg.play().catch(()=>{}); else bg.pause();
};

// ===================== KAWAII EFFECTS =====================
const effects=document.getElementById("effects");

function createEffect(icon, interval, minSize=16, maxSize=28, durationMin=4000, durationMax=7000, rotate=false){
  setInterval(()=>{
    const el=document.createElement("div");
    el.textContent=icon;
    el.style.position="absolute";
    el.style.left=Math.random()*100+"%";
    el.style.top="-5%";
    el.style.fontSize=(minSize+Math.random()*(maxSize-minSize))+"px";
    effects.appendChild(el);
    const dur=durationMin+Math.random()*(durationMax-durationMin);
    const keyframes = rotate ? 
      [{transform:"translateY(0) rotate(0deg)",opacity:1},{transform:`translateY(110vh) rotate(${360*Math.random()}deg)`,opacity:0}] :
      [{transform:"translateY(0)",opacity:1},{transform:"translateY(100vh)",opacity:0}];
    el.animate(keyframes,{duration:dur,easing:"linear"});
    setTimeout(()=>el.remove(),dur);
  },interval);
}

createEffect("🌸",700,16,28,5000,8000,true);
createEffect("💗",500,16,28,4000,7000,true);
createEffect("🎈",1200,20,36,5000,8000,false);

// Balon di bingkai
const frame = document.querySelector(".birthday-frame");
setInterval(()=>{
  const fb=document.createElement("div");
  fb.textContent="🎈";
  fb.style.position="absolute";
  fb.style.left=Math.random()*80 + "%";
  fb.style.bottom="-10%";
  fb.style.fontSize=(15+Math.random()*15)+"px";
  fb.style.opacity=0.8;
  frame.appendChild(fb);
  const dur=4000+Math.random()*3000;
  fb.animate([{transform:"translateY(0)"},{transform:"translateY(-120px)"}],{duration:dur,easing:"linear"});
  setTimeout(()=>fb.remove(),dur);
},800);

// ===================== DOLL BUTTON DARI KADO =====================
document.getElementById("dollBtn").onclick = ()=>{
  const frame = document.querySelector(".birthday-frame");

  // Kado
  const gift = document.createElement("div");
  gift.textContent = "🎁";
  gift.style.position = "absolute";
  gift.style.left = "50%";
  gift.style.top = "50%";
  gift.style.transform = "translate(-50%,-50%) rotate(0deg)";
  gift.style.fontSize = "80px";
  gift.style.cursor = "pointer";
  gift.style.zIndex = 140;
  frame.appendChild(gift);

  // Beruang (isi kado) awalnya tersembunyi
  const doll = document.createElement("div");
  doll.className = "doll";
  doll.textContent = "🧸";
  doll.style.position = "absolute";
  doll.style.left = "50%";
  doll.style.top = "50%";
  doll.style.transform = "translate(-50%,-50%) scale(0)";
  doll.style.fontSize = "200px";
  doll.style.zIndex = 150;
  effects.appendChild(doll);

  // Efek goyang kado
  let angle = 0, shakes = 0;
  const shakeInterval = setInterval(()=>{
    angle = angle === 0 ? 15 : -angle;
    gift.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;
    shakes++;
    if(shakes > 6){ // selesai goyang
      clearInterval(shakeInterval);
      gift.remove(); // kado hilang

      // Beruang muncul dari posisi kado
      doll.animate(
        [
          {transform:"translate(-50%, -50%) scale(0) rotate(0deg)", opacity:1},
          {transform:"translate(-50%, -50%) scale(1.2) rotate(360deg)", opacity:1}
        ],
        {duration:2000, easing:"ease-out"}
      );

      setTimeout(()=>{
        doll.style.transform="translate(-50%,-50%) scale(0)";
        doll.style.opacity="0";
        setTimeout(()=>doll.remove(),600);
      },2000);
    }
  }, 100);
};
</script>
</body>
</html>
