<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Birthday Kawaii</title>

<!-- ===========================
     BASE STYLE (kawaii theme)
     =========================== -->
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffe6f9, #ffecff, #ffe4f8);
    text-align: center;
    padding: 25px;
}

h1 {
    color: #ff4fa8;
    font-size: 42px;
    text-shadow: 0 0 10px #ffc1e5;
    margin-bottom: 10px;
}

.birthday-frame {
    position: relative;
    width: 290px;
    height: 290px;
    margin: 30px auto;
    border: 6px solid #ff93d6;
    border-radius: 25px;
    padding: 10px;
    background: linear-gradient(135deg, #ffdaf1, #ffd0f3);
    box-shadow: 0 10px 30px rgba(255,120,170,0.4),
                inset 0 0 20px rgba(255,180,220,0.6);
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 10px 30px rgba(255,120,170,0.4); }
    to   { box-shadow: 0 10px 40px rgba(255,150,200,0.7); }
}

.birthday-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
}

/* umur */
#umurBox {
    margin-top: 5px;
    font-size: 13px;
    color: #b30069;
    font-weight: bold;
    opacity: 0.8;
}

/* ===========================
   TEKS BERJALAN (no cut)
   =========================== */
.marquee {
    position: relative;
    overflow: hidden;
    width: 100%;
    margin-top: 20px;
}
.marquee span {
    display: inline-block;
    padding-left: 100%;
    font-size: 22px;
    color: #ff2d9b;
    font-weight: bold;
    white-space: nowrap;
    animation: marquee 12s linear infinite;
}
@keyframes marquee {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-100%); }
}

/* ===========================
   LOADING SCREEN
   =========================== */
#loadingScreen {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: #ffe4f8;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:9999;
    font-family:'Poppins';
}
.loading-heart {
    font-size:50px;
    animation: heartbeat 1s infinite;
}
@keyframes heartbeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

/* ===========================
   POPUP CARD
   =========================== */
#popupCard {
    position: fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%) scale(0);
    width: 80%;
    max-width: 330px;
    background: #fff0fa;
    border-radius: 20px;
    padding: 20px;
    text-align:center;
    box-shadow: 0 0 20px rgba(255,100,200,0.4);
    font-family:'Poppins';
    z-index: 9990;
    transition: 0.4s ease;
}
#popupCard.show {
    transform:translate(-50%, -50%) scale(1);
}
#popupCard h2 {
    color:#ff2d9b;
}
#closePopup {
    margin-top:15px;
    background:#ff7dc3;
    border:none;
    padding:8px 20px;
    border-radius: 12px;
    color:white;
    cursor:pointer;
}

/* ===========================
   PESAN NEXT/BACK
   =========================== */
#pesanArea {
    font-size:24px;
    color:#ff2d9b;
    font-weight:bold;
    margin-top:10px;
    min-height:40px;
    text-shadow:0 0 6px #ffc1e5;
}

.nav-btn {
    background:#ffabd9;
    border:none;
    padding:6px 12px;
    margin: 0 5px;
    border-radius:10px;
    color:white;
    cursor:pointer;
    font-size:14px;
}
.nav-btn:hover {
    background:#ff8ccf;
}
</style>

</head>
<body>

<!-- Loading -->
<div id="loadingScreen">
    <div class="loading-heart">💗</div>
    <p style="color:#ff2d9b;font-weight:bold;">Loading...</p>
</div>

<h1>Happy Birthday 💗✨</h1>

<!-- Foto -->
<div class="birthday-frame">
    <img src="foto.jpg" class="birthday-photo">
</div>

<div id="umurBox">menghitung umur…</div>

<!-- Teks berjalan -->
<div class="marquee">
    <span>semoga keinginan dan harapannya terkabul 💖</span>
</div>

<!-- Tombol popup -->
<div style="font-size:55px; margin-top:25px; cursor:pointer;" onclick="openPopup()">💌</div>

<!-- PESAN -->
<div id="pesanArea"></div>
<div style="margin-top:10px;">
    <button class="nav-btn" onclick="prevMsg()">◀</button>
    <button class="nav-btn" onclick="nextMsg()">▶</button>
</div>

<!-- POPUP KARTU -->
<div id="popupCard">
    <h2>🎀 Happy Birthday! 🎀</h2>
    <p style="color:#b30069; font-weight:bold;">
        Semoga hari ini membawa kebahagiaan,<br>
        senyum manis, dan keberkahan.
    </p>
    <button id="closePopup">Tutup</button>
</div>

<!-- ===========================
     SCRIPT SEMUA FITUR
     =========================== -->
<script>
/* Loading */
window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loadingScreen").style.display = "none";
    }, 1000);
});

/* Popup */
function openPopup() {
    document.getElementById("popupCard").classList.add("show");
}
document.getElementById("closePopup").onclick = function() {
    document.getElementById("popupCard").classList.remove("show");
};

/* Pesan Next/Back */
const pesanList = [
    "⏳ Waktu berubah",
    "🎂 Umur bertambah",
    "💘 Perasaan tertinggal",
    "💖 Namun kenangan tetap tersimpan",
    "🌸 Semoga hatimu selalu bahagia"
];
let indexPesan = 0;
function tampilkanPesan() {
    document.getElementById("pesanArea").innerHTML = pesanList[indexPesan];
}
function nextMsg() {
    indexPesan = (indexPesan + 1) % pesanList.length;
    tampilkanPesan();
}
function prevMsg() {
    indexPesan = (indexPesan - 1 + pesanList.length) % pesanList.length;
    tampilkanPesan();
}
tampilkanPesan();

/* Hitung Umur (WIB) */
function hitungUmur() {
    const lahir = new Date("2002-11-15T00:00:00+07:00");
    const now = new Date(Date.now() + (7 * 3600 * 1000));

    let delta = (now - lahir) / 1000;

    const tahun  = Math.floor(delta / (3600*24*365));
    delta -= tahun * 3600*24*365;

    const bulan  = Math.floor(delta / (3600*24*30));
    delta -= bulan * 3600*24*30;

    const minggu = Math.floor(delta / (3600*24*7));
    delta -= minggu * 3600*24*7;

    const hari   = Math.floor(delta / (3600*24));
    delta -= hari * 3600*24;

    const jam    = Math.floor(delta / 3600);
    delta -= jam * 3600;

    const menit  = Math.floor(delta / 60);
    delta -= menit * 60;

    const detik  = Math.floor(delta);

    document.getElementById("umurBox").innerHTML =
        `Umur: ${tahun} thn ${bulan} bln ${minggu} mgg 
        ${hari} hr ${jam} j ${menit} m ${detik} dtk (WIB)`;
}

setInterval(hitungUmur, 1000);
hitungUmur();
</script>

</body>
</html>
