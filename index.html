<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday</title>

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #f7d6e0;
        text-align: center;
        overflow-x: hidden;
    }

    /* ===== Foto + Bingkai ===== */
    .frame {
        width: 260px;
        height: 260px;
        padding: 20px;
        background-image: url('bingkai.png'); /* pastikan nama sama! */
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 25px;
        margin: 30px auto 10px auto;
    }

    .foto {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    }

    h1 {
        color: pink;
        font-size: 38px;
        margin-top: -5px;
    }

    .umur {
        font-size: 24px;
        margin-top: -5px;
    }

    /* ===== Teks Berjalan ===== */
    marquee {
        margin-top: 10px;
        font-size: 20px;
        color: #b4004e;
        font-weight: bold;
    }

    /* ===== Form Pesan ===== */
    .pesan-box {
        margin-top: 25px;
    }

    input {
        width: 60%;
        padding: 10px;
        border-radius: 10px;
        border: 2px solid #ff7aa8;
    }

    button {
        padding: 10px 15px;
        background: hotpink;
        border: none;
        color: white;
        border-radius: 10px;
        font-weight: bold;
    }

    .status {
        margin-top: 10px;
        color: red;
    }

</style>
</head>
<body>

<!-- Musik -->
<audio src="musik.mp3" autoplay loop hidden></audio>

<!-- Foto + Bingkai -->
<div class="frame">
    <img src="foto.jpg" class="foto">
</div>

<h1>Happy Birthday 🎉🎂</h1>

<!-- Umur -->
<p class="umur" id="umur">...</p>

<!-- Teks Berjalan -->
<marquee>Semoga keinginan dan harapannya terkabul 💖</marquee>

<!-- Form Pesan -->
<div class="pesan-box">
    <h2>Kirim Harapan</h2>
    <input type="text" id="pesan" placeholder="Tulis harapanmu...">
    <button onclick="kirim()">Kirim</button>
    <p class="status" id="status"></p>
</div>

<script>
/* ===== Hitung Umur ===== */
function hitungUmur() {
    const lahir = new Date("2002-11-15");
    const sekarang = new Date();
    let umur = sekarang.getFullYear() - lahir.getFullYear();

    // Jika belum ulang tahun bulan ini
    const bulan = sekarang.getMonth() - lahir.getMonth();
    if (bulan < 0 || (bulan === 0 && sekarang.getDate() < lahir.getDate())) {
        umur--;
    }

    document.getElementById("umur").innerHTML = `🎂 ${umur} Tahun 🎉`;
}
hitungUmur();

/* ===== Kirim Pesan ke GitHub ===== */
function kirim() {
    let pesan = document.getElementById("pesan").value.trim();
    let status = document.getElementById("status");

    if (pesan === "") {
        status.innerHTML = "Tulis pesan dulu.";
        return;
    }

    status.innerHTML = "Mengirim...";

    fetch("https://api.github.com/repos/adekanbara/HB/dispatches", {
        method: "POST",
        headers: {
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
            "Authorization": "Bearer MYHB" 
        },
        body: JSON.stringify({
            event_type: "kirim_pesan",
            client_payload: { pesan: pesan }
        })
    })
    .then(res => {
        if (res.status === 204) {
            status.style.color = "green";
            status.innerHTML = "Pesan terkirim!";
            document.getElementById("pesan").value = "";
        } else {
            status.innerHTML = "Gagal mengirim.";
        }
    });
}
</script>

</body>
</html>
